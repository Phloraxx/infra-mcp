name: Release native binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x86_64
            extension: ""
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            extension: ""
          - runner: macos-latest
            asset: macos-aarch64
            extension: ""
          - runner: macos-15-intel
            asset: macos-x86_64
            extension: ""
          - runner: windows-latest
            asset: windows-x86_64
            extension: .exe
          - runner: windows-11-arm
            asset: windows-aarch64
            extension: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Ensure a release trust key is provisioned
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          INFRA_RELEASE_PUBLIC_KEY_B64: ${{ vars.INFRA_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INFRA_RELEASE_PUBLIC_KEY_B64)) { throw "Release key missing: set repository variable INFRA_RELEASE_PUBLIC_KEY_B64" }
      - run: cargo build --release -p infra-agent -p infra-cli
        env:
          INFRA_RELEASE_PUBLIC_KEY_B64: ${{ vars.INFRA_RELEASE_PUBLIC_KEY_B64 }}
      - name: Package binaries and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $extension = '${{ matrix.extension }}'
          $asset = '${{ matrix.asset }}'
          foreach ($binary in @('infra', 'infra-agent')) {
            $source = "target/release/$binary$extension"
            $name = "$binary-$asset$extension"
            $destination = "dist/$name"
            Copy-Item $source $destination
            $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Encoding ascii "$destination.sha256" "$hash  $name"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: infra-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: infra-*
          path: release
          merge-multiple: true
      - name: Install manifest signing dependency
        run: python3 -m pip install --disable-pip-version-check cryptography
      - name: Sign checksummed release manifest
        env:
          INFRA_RELEASE_SIGNING_KEY_B64: ${{ secrets.INFRA_RELEASE_SIGNING_KEY_B64 }}
          INFRA_RELEASE_PUBLIC_KEY_B64: ${{ vars.INFRA_RELEASE_PUBLIC_KEY_B64 }}
        run: python3 scripts/sign-release.py --directory release --version "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --notes-file docs/RELEASE_CANDIDATE.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
