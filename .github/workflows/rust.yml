name: Rust

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Dashboard syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Cheap early warning: a parse error in the dashboard or the gate must not
      # wait for the Playwright install to surface.
      - name: Parse the dashboard and the browser gate
        run: |
          node --check apps/dashboard/app.js
          node --check scripts/test-dashboard-browser.cjs
          node --check scripts/snapshot-overview-fixture.cjs
  dashboard:
    name: Dashboard browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/infra-dashboard-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/infra-dashboard-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test dashboard interactions
        run: NODE_PATH="$RUNNER_TEMP/infra-dashboard-browser/node_modules" node scripts/test-dashboard-browser.cjs
  fault-injection:
    name: Fault injection harness
    runs-on: ubuntu-latest
    # The scenarios include a real 30s heartbeat deadline; the whole job stays
    # well inside this budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # The harness spawns the real binaries, so build them once up front and
      # keep the timed section to the scenarios themselves.
      - name: Build the gateway and agent binaries
        run: cargo build --locked -p infra-gateway -p infra-agent
      - name: Run the fault-injection scenarios
        run: cargo test --locked -p infra-e2e -- --test-threads=1
  cross-check:
    name: Cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # rustls pulls in aws-lc-sys, which needs a C toolchain for the target.
      - name: Install the mingw-w64 linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # Keeps the Windows agent and CLI compiling on every push without waiting
      # for the slow windows-latest runner in windows-release-check.yml.
      - name: Check the agent and CLI for Windows x64
        run: cargo check --target x86_64-pc-windows-gnu -p infra-agent -p infra-cli
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        run: ./scripts/smoke-v1.sh
      - if: matrix.os == 'ubuntu-latest'
        run: ./scripts/smoke-install-dashboard.sh
      - name: Release version policy acceptance
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-release-policy.py
      - name: Release packaging contract acceptance
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/infra-release-fixture"
          "$RUNNER_TEMP/infra-release-fixture/bin/pip" install --disable-pip-version-check cryptography
          "$RUNNER_TEMP/infra-release-fixture/bin/python" scripts/test-release-signing.py
      - name: Native installer transaction acceptance
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-install-safety.py
      - if: matrix.os == 'ubuntu-latest'
        run: ./scripts/smoke-dashboard-password.sh
      - if: matrix.os == 'ubuntu-latest'
        run: ./scripts/smoke-pairing.sh
      - name: MCP schema and error contract smoke
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/smoke-mcp-contract.py
      # The darwin half of the cross-compile smoke. It runs on the macOS runner
      # because aws-lc-sys needs an Apple C toolchain, which a Linux runner does
      # not have; the Windows half runs in the cross-check job above.
      - name: Check the agent and CLI for macOS ARM64
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin -p infra-agent -p infra-cli
      - name: Build native acceptance binaries
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p infra-agent -p infra-cli
      - name: Check native release metadata
        if: matrix.os == 'macos-latest'
        shell: pwsh
        run: |
          $InfraPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $InfraPython scripts/release_contract.py --binaries target/release
          if ($LASTEXITCODE -ne 0) { throw "Native release metadata check failed" }
      - name: Upload macOS ARM64 acceptance binaries
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: infra-acceptance-macos-aarch64
          path: |
            target/release/infra
            target/release/infra-agent
          if-no-files-found: error
          retention-days: 7
