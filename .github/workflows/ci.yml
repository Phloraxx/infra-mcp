name: CI (legacy TypeScript v0.3)

# Legacy Node.js surface kept as the production fallback (apps/mcp-server,
# apps/host-agent). Rust v1 CI lives in rust.yml. This workflow only runs when
# the legacy surface or its config changes.
on:
  push:
    branches: [main]
    paths:
      - apps/mcp-server/**
      - apps/host-agent/**
      - package.json
      - tsconfig.base.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - apps/mcp-server/**
      - apps/host-agent/**
      - package.json
      - tsconfig.base.json
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
