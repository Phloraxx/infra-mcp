[workspace]
members = [
  "crates/protocol",
  "crates/gateway",
  "crates/agent",
  "crates/platform",
  "crates/local-state",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws", "json"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.3.4"
hmac = "0.12.1"
globset = "0.4.18"
keyring = "4.2.0"
regex = "1.12.2"
ignore = "0.4.25"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
sysinfo = "0.39.6"
tempfile = "3.27.0"
url = "2.5.7"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.2.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
trash = "5"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
